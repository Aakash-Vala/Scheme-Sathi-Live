version: '3.8'

services:
  web:
    build: .
    container_name: scheme_sathi_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/scheme_sathi_sih
      - MONGO_DB_NAME=scheme_sathi_sih
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongo:
    image: mongo:7.0
    container_name: scheme_sathi_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
